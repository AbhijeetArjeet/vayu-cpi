databases:
  - name: vayu-cpi-db
    plan: free
    databaseName: vayu_cpi
    user: vayu_cpi_user

services:
  # --- FastAPI Backend ---
  - type: web
    name: vayu-cpi-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn services.api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vayu-cpi-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: PYTHONUNBUFFERED
        value: "1"
    healthCheckPath: /health

  # --- Background Scraper (runs every 6 hours) ---
  - type: worker
    name: vayu-cpi-scheduler
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m services.ingestion.scheduler
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vayu-cpi-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: PYTHONUNBUFFERED
        value: "1"
